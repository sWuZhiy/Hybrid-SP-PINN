# Hybrid SP-PINN 默认参数配置
# 所有物理参数集中在此文件，业务代码禁止散落魔法数字。
# 数值为项目初始值，最终须以可信文献/QTCAD 参考实现交叉核对。

geometry:
  t_ox_nm: 2.0          # 氧化层厚度 [nm]
  L_si_nm: 100.0        # 硅区长度 [nm]
  n_grid: 1000          # 网格点数

material:
  eps_si_r: 11.7        # 硅相对介电常数
  eps_ox_r: 3.9         # 二氧化硅相对介电常数
  m_l: 0.91             # 硅纵向有效质量 [m0]
  m_t: 0.19             # 硅横向有效质量 [m0]
  m_ox: 0.5             # 二氧化硅有效质量 [m0]（仅显式氧化层波函数时用）
  delta_Ec_eV: 3.1      # Si/SiO2 导带带阶 [eV]，须最终确认
  E_g_eV: 1.12          # 硅带隙 [eV]（能量基准：E_i = Ec - E_g/2）
  # 能谷简并（(100) 硅表面，6 个 Delta 能谷按 z 向有效质量分裂为两组）
  valley:
    g_s: 2              # 自旋简并度
    g_v: [2, 4]         # 能谷简并度（二重 / 四重）
    # 注：各能谷组的 z 向限域质量 m _z 与平面 DOS 质量 m_par 由 m_l/m_t 推导：
    #     m_z = [m_l, m_t]，m_par = [m_t, sqrt(m_l*m_t)]，见 materials.py

substrate:
  type: p               # 掺杂类型
  NA_cm3: 1.0e+17       # 掺杂浓度 [cm^-3]（科学计数需带符号，否则 YAML 解析为字符串）
  n_i_cm3: 1.5e10       # 本征载流子浓度 [cm^-3]（Si, 300 K），用于经典空穴浓度 p(z)

thermal:
  T_K: 300.0            # 温度 [K]

solver:
  num_states: 15        # 束缚态数目（两组能谷合计）
  mixing_alpha: 0.5     # Anderson 混合的保守因子（外层固定点外推，0 < alpha <= 1）
  tol_V: 1.0e-6         # 电势收敛阈值 [V]
  max_iter: 200         # 最大自洽迭代轮数

pinn:
  hidden_layers: 4      # 隐藏层数
  hidden_width: 64      # 隐藏层宽度
  activation: tanh      # 激活函数
  optimizer: Adam       # 优化器
  lr: 1.0e-3            # 初始学习率
  epochs: 3000          # 训练轮数（单点训练；Stage 10 再调策略）
  lam_iface: 1.0        # 界面 Robin 软损失权重 λ_iface
  seed: 0               # 随机种子（保证可复现）
  hard_constraint: true # 硬约束 φ̄(u)=(1-u)·NN(u) 强制 φ(L)=0（可消融）
  n_ramp_frac: 0.5      # 课程学习：前 50% 轮内 n 从 0 线性升满（强反型防错误势阱）
